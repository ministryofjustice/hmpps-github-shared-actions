name: Cloud Platform Deploy
description: Deploy to Cloud Platform using Helm

inputs:
  dryrun:
    description: Whether to actually perform the helm upgrade
    default: "false"
    required: false
  environment:
    description: The environment to deploy to (dev/staging/preprod/prod)
    required: true
  version:
    description: The version of the service to deploy
    required: true
  k8s_deployment_name:
    description: "Kubernetes deployment name, also Helm release name"
    required: true
  changelog_git_paths:
    default: ''
    description: When set it will limit the file changes shown in the changelog to the specified paths only. This is useful for multi-project builds where otherwise it will show all changes from all projects.
    required: false
  show_changelog:
    description: Whether the changelog should be sent by slack
    required: false
  helm_additional_args:
    description: any additional helm arguments
    required: false
    default: ''
  helm_timeout:
    description: helm timeout period
    required: false
    default: 5m
  helm_dir:
    description: location of helm configuration
    required: false
    default: helm_deploy
  helm_chart_name:
    description: location of helm chart within the helm_dir
    required: true
  helm_allowlist_groups:
    description: values for location of allowlist groups file
    required: false
  helm_allowlist_version:
    description: setting for version of allowlist file
    required: false
  autogenerate_scheduled_downtime_cron:
    description: "Whether to set the deterministic scheduled downtime cron values"
    required: false
    default: "true"
  application:
    description: Logical service name sent to the event manager. Defaults to the k8s deployment name.
    required: false
    default: ''
  artifact_name:
    description: Name of the built artifact a build-provenance attestation was generated for
    required: false
    default: ''
  artifact_digest:
    description: "sha256:<digest> of the built artifact a build-provenance attestation was generated for"
    required: false
    default: ''
  eventmanager_private_key:
    description: Private key of the GitHub App used to dispatch the deployment event (HMPPS_SRE_EVENTMANAGER_PRIVATE_KEY). Leave empty to skip notification.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Check for IP_ALLOWLIST_GROUPS_YAML
      shell: bash
      id: check-ip-allowlists
      run: |
        if [[ -n "${{ inputs.helm_allowlist_groups }}" ]]; then
          echo "${{ inputs.helm_allowlist_groups }}" | base64 --decode > ./ip-allowlist-groups.yaml
          echo "ALLOWLIST_GROUPS=--values ./ip-allowlist-groups.yaml" >> $GITHUB_OUTPUT
        fi

    - name: Check for IP_ALLOWLIST_GROUPS_VERSION
      shell: bash
      id: check-ip-allowlists-version
      run: |
        if [[ -n "${{ inputs.helm_allowlist_version }}" ]]; then
          echo "ALLOWLIST_VERSION=--set generic-service.allowlist_version=${{ inputs.helm_allowlist_version }}" >> $GITHUB_OUTPUT
          echo "ALLOWLIST_VERSION_VALUE=${{ inputs.helm_allowlist_version }}" >> $GITHUB_OUTPUT
        fi

    - name: Deploy
      shell: bash
      run: |
        yq -i ".appVersion = \"${{ inputs.version }}\"" "${{ inputs.helm_dir }}/${{ inputs.helm_chart_name }}/Chart.yaml"
        helm dependency update "${{ inputs.helm_dir }}/${{ inputs.helm_chart_name }}"

        # Split additional args into an array
        read -r -a helm_args <<< "${{ inputs.helm_additional_args }}"

        # For services that have the startup/shutdown script enabled.
        # Autogenerate schedule downtime cron. This is a pseudo-random, deterministic number used in the cron start/shutdown minute.
        # This is to help ensure the startup/shutdown pods do not all run at the exact same time - which can cause cluster auto-scalling issues.
        if [[ "${{ inputs.autogenerate_scheduled_downtime_cron }}" == "true" ]]; then
          hash_prefix=$(echo -n "${{ inputs.k8s_deployment_name }}" | md5sum | cut -c1-4)
          cron_minute=$(( 0x${hash_prefix} % 60 ))
          startup_cron="${cron_minute} 6 * * 1-5"
          shutdown_cron="${cron_minute} 21 * * 1-5"
          helm_args+=(--set "generic-service.scheduledDowntime.startup=${startup_cron}")
          helm_args+=(--set "generic-service.scheduledDowntime.shutdown=${shutdown_cron}")
        fi
        if [[ "${{ inputs.dryrun }}" == "true" ]]; then
          helm_args+=(--dry-run=client)
        fi

        exec helm upgrade '${{ inputs.k8s_deployment_name }}' '${{ inputs.helm_dir }}/${{ inputs.helm_chart_name }}' \
          --rollback-on-failure \
          --history-max 10 \
          --install \
          --reset-values \
          --set 'generic-service.image.tag=${{ inputs.version }}' \
          --set 'version=${{ inputs.version }}' \
          --set 'global.environment=${{ inputs.environment }}' \
          --timeout ${{ inputs.helm_timeout }} \
          --values '${{ inputs.helm_dir }}/values-${{ inputs.environment }}.yaml' \
          "${helm_args[@]}" \
          ${{ steps.check-ip-allowlists.outputs.ALLOWLIST_GROUPS }} \
          ${{ steps.check-ip-allowlists-version.outputs.ALLOWLIST_VERSION }} \
          --wait

    - name: Create production deployment details
      id: create_allowlist_json
      if: ${{ startsWith(inputs.environment, 'prod') }}
      shell: bash
      run: |
        allowlist_version="${{ steps.check-ip-allowlists-version.outputs.ALLOWLIST_VERSION_VALUE }}"
        if [[ -n "$allowlist_version" ]]; then
          printf '{\n  "allowlist_version": "%s"\n}\n' "$allowlist_version" > prod-ip-allowlist-version-details.json
          echo "allowlist_version=true" >> "$GITHUB_OUTPUT"
        else 
          echo "allowlist_version=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload production deployment details artifact
      if: ${{ startsWith(inputs.environment, 'prod') && steps.create_allowlist_json.outputs.allowlist_version == 'true' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: prod-deploy-details
        path: prod-ip-allowlist-version-details.json
        overwrite: true

    - name: Federate token via Octo STS
      id: octo-sts
      if: ${{ inputs.dryrun != 'true' }}
      continue-on-error: true
      uses: octo-sts/action@main   # pin to a SHA in practice
      with:
        scope: ministryofjustice/hmpps-eventmanager
        identity: deploy-notify

    - name: Notify hmpps-eventmanager of deployment
      id: eventmanager_dispatch
      if: ${{ inputs.dryrun != 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        APPLICATION: ${{ inputs.application != '' && inputs.application || inputs.k8s_deployment_name }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION: ${{ inputs.version }}
        COMMIT_SHA: ${{ github.sha }}
        DEPLOYED_BY: ${{ github.triggering_actor }}
        SOURCE_REPO: ${{ github.repository }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        if [[ -z "${GH_TOKEN}" ]]; then
          echo "::warning title=Event manager notification skipped::Could not mint a GitHub App token, so no deployment event was sent. The deployment itself succeeded."
          exit 0
        fi

        correlation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
        if ! gh workflow run receive-event.yml \
          --repo ministryofjustice/hmpps-eventmanager \
          --ref main \
          --field application="${APPLICATION}" \
          --field environment="${ENVIRONMENT}" \
          --field version="${VERSION}" \
          --field commit_sha="${COMMIT_SHA}" \
          --field deployed_by="${DEPLOYED_BY}" \
          --field source_repo="${SOURCE_REPO}" \
          --field artifact_name="${ARTIFACT_NAME}" \
          --field artifact_digest="${ARTIFACT_DIGEST}" \
          --field correlation_id="${correlation_id}" \
          --field source_run_url="${SOURCE_RUN_URL}"; then
          echo "::warning title=Event manager notification failed::Could not dispatch receive-event.yml in ministryofjustice/hmpps-eventmanager. The deployment itself succeeded."
          exit 0
        fi
        echo "correlation_id=${correlation_id}" >> "$GITHUB_OUTPUT"

    - name: Link to downstream run in job summary
      if: ${{ steps.eventmanager_dispatch.outputs.correlation_id != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        EVENT_HANDLER_REPO: ministryofjustice/hmpps-eventmanager
        EVENT_HANDLER_WORKFLOW: receive-event.yml
        CORRELATION_ID: ${{ steps.eventmanager_dispatch.outputs.correlation_id }}
      run: |
        set -uo pipefail
        run_url=""
        run_title=""

        # The dispatched run takes a few seconds to appear in the API.
        for _ in $(seq 1 15); do
          sleep 2
          match=$(gh api "repos/${EVENT_HANDLER_REPO}/actions/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.display_title | contains(env.CORRELATION_ID)) | \"\(.html_url)|\(.display_title)\"] | first // empty") || true
          if [[ -n "${match}" ]]; then
            run_url="${match%%|*}"
            run_title="${match#*|}"
            break
          fi
        done

        {
          echo "### Downstream workflow"
          if [[ -n "${run_url}" ]]; then
            echo "Triggered [\`${EVENT_HANDLER_WORKFLOW}\`](${run_url}) (\"${run_title}\") in \`${EVENT_HANDLER_REPO}\`"
          else
            echo "Triggered \`${EVENT_HANDLER_WORKFLOW}\` in \`${EVENT_HANDLER_REPO}\` with correlation id \`${CORRELATION_ID}\` (run not found within the poll window - check that repo's Actions tab)"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        if [[ -z "${run_url}" ]]; then
          echo "::warning title=Downstream run not found::Dispatched receive-event.yml with correlation id ${CORRELATION_ID} but the run did not appear within the poll window."
        fi

name: 'Snyk Scan Slack message for failure or findings'
description: 'Sends a slack message to notify of failure or findings'
inputs:
  title:
    description: "Title of the failed workflow"
    required: true
  warningOnly:
    description: "If true then emit a warning, else emit a failure"
    required: true
  channel_id:
    description: "Slack channel to send to"
    required: true
  SLACK_BOT_TOKEN:
    description: "Important slack token"
    required: true
  subproject:
    description: 'For gradle multi module projects, leave blank for single module projects'
    required: false
    default: ''
  scan_context:
    description: 'Scan context (for example image or fs)'
    required: false
    default: ''
  summary_json:
    description: 'Preformatted Slack mrkdwn summary payload text (JSON-encoded)'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # v3.0.2
      if: inputs.summary_json == ''
      with:
        method: chat.postMessage
        token: ${{ inputs.SLACK_BOT_TOKEN }}
        payload: |
          channel: ${{ inputs.channel_id }}
          text: "*${{ inputs.title }}* ${{ inputs.warningOnly == 'true' && 'completed with findings' || 'failed' }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "${{ inputs.warningOnly == 'true' && ':warning:' || ':no_entry:' }} Github Workflow ${{ github.workflow }} ${{ inputs.warningOnly == 'true' && 'completed with findings' || 'failed' }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Code scanning:*\n<${{ github.server_url }}/${{ github.repository }}/security/code-scanning>"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                - type: mrkdwn
                  text: "*Job:*\n${{ github.job }}"
                - type: mrkdwn
                  text: "*Repo:*\n${{ github.repository }}"
                - type: mrkdwn
                  text: "*Project:*\n${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}"
                - type: mrkdwn
                  text: "*Scan type:*\n${{ inputs.scan_context != '' && inputs.scan_context || 'n/a' }}"

    - uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # v3.0.2
      if: inputs.summary_json != ''
      with:
        method: chat.postMessage
        token: ${{ inputs.SLACK_BOT_TOKEN }}
        payload: |
          channel: ${{ inputs.channel_id }}
          text: "*${{ inputs.title }}* ${{ inputs.warningOnly == 'true' && 'completed with findings' || 'failed' }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "${{ inputs.warningOnly == 'true' && ':warning:' || ':no_entry:' }} Github Workflow ${{ github.workflow }} ${{ inputs.warningOnly == 'true' && 'completed with findings' || 'failed' }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Code scanning:*\n<${{ github.server_url }}/${{ github.repository }}/security/code-scanning>"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                - type: mrkdwn
                  text: "*Job:*\n${{ github.job }}"
                - type: mrkdwn
                  text: "*Repo:*\n${{ github.repository }}"
                - type: mrkdwn
                  text: "*Project:*\n${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}"
                - type: mrkdwn
                  text: "*Scan type:*\n${{ inputs.scan_context != '' && inputs.scan_context || 'n/a' }}"
            - type: section
              text:
                type: mrkdwn
                text: ${{ inputs.summary_json }}

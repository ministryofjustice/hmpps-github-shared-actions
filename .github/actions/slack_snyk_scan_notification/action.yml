name: 'failure Slack message'
description: 'Sends a slack message to notify of failure'
inputs:
  title:
    description: "Title of the failed workflow"
    required: true
  warningOnly:
    description: "If true then emit a warning, else emit a failure"
    required: true
  channel_id:
    description: "Slack channel to send to"
    required: true
  SLACK_BOT_TOKEN:
    description: "Important slack token"
    required: true
  subproject:
    description: 'For gradle multi module projects, leave blank for single module projects'
    required: false
    default: ''
  scan_context:
    description: 'Scan context (for example image or fs)'
    required: false
    default: ''
  summary:
    description: 'A summary of vulnerabilities'
    required: false
    default: '' 
runs:
  using: "composite"
  steps:
    - name: Resolve summary text
      id: resolve-summary
      shell: bash
      run: |
        resolved_summary="${{ inputs.summary }}"

        if [[ "$resolved_summary" == "true" || "$resolved_summary" == "false" ]]; then
          if [[ -s snyk-results.json ]]; then
            resolved_summary=$(jq -r '
              def roots:
                if type == "array" then .[] else . end;
              def vulns:
                [
                  roots | select(type == "object")
                  | ((.vulnerabilities // [])[]?), ((.applications // [])[]? | (.vulnerabilities // [])[]?)
                  | select(type == "object")
                ];
              def sev($v):
                (($v.severity // "unknown") | tostring | ascii_downcase | if . == "moderate" then "medium" else . end);

              (vulns) as $v
              | ($v | map((.id // "issue") + "|" + sev(.) + "|" + ((.packageName // .name // "unknown") + "@" + (.version // "unknown")) ) | unique) as $u
              | ($u | length) as $total
              | ($u | map(split("|")[1]) | map(select(. == "critical")) | length) as $critical
              | ($u | map(split("|")[1]) | map(select(. == "high")) | length) as $high
              | ($u | map(split("|")[1]) | map(select(. == "medium")) | length) as $medium
              | ($u | map(split("|")[1]) | map(select(. == "low")) | length) as $low
              | (roots | select(type == "object") | .summary // "") as $s
              | "Total: \($total) (Critical: \($critical), High: \($high), Medium: \($medium), Low: \($low))"
                + (if $s != "" then "\n" + $s else "" end)
            ' snyk-results.json 2>/dev/null || true)
          fi

          if [[ -z "$resolved_summary" || "$resolved_summary" == "true" || "$resolved_summary" == "false" ]]; then
            resolved_summary="Vulnerabilities found. Detailed summary unavailable."
          fi
        fi

        {
          echo "summary<<EOF"
          echo "$resolved_summary"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # v3.0.2
      if: steps.resolve-summary.outputs.summary == ''
      with:
        method: chat.postMessage
        token: ${{ inputs.SLACK_BOT_TOKEN }}
        payload: |
          channel: ${{ inputs.channel_id }}
          text: "*${{ inputs.title }}* ${{ inputs.warningOnly == 'true' && 'issues identified' || 'failed' }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "${{ inputs.warningOnly == 'true' && ':warning:' || ':no_entry:' }} Github Workflow ${{ github.workflow }} ${{ inputs.warningOnly == 'true' && 'ran and identified issues' || 'failed' }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Code scanning:*\n<${{ github.server_url }}/${{ github.repository }}/security/code-scanning>"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                - type: mrkdwn
                  text: "*Job:*\n${{ github.job }}"
                - type: mrkdwn
                  text: "*Repo:*\n${{ github.repository }}"
                - type: mrkdwn
                  text: "*Project:*\n${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}"
                - type: mrkdwn
                  text: "*Scan type:*\n${{ inputs.scan_context != '' && inputs.scan_context || 'n/a' }}"

    - name: Prepare summary payload
      if: steps.resolve-summary.outputs.summary != ''
      id: prepare-summary
      shell: bash
      run: |
        summary_json=$(printf '%s' "${{ steps.resolve-summary.outputs.summary }}" | jq -Rs '"*Summary*\n```\n" + (gsub("\\r"; "")) + "\n```"')
        echo "summary_json=${summary_json}" >> "$GITHUB_OUTPUT"

    - uses: slackapi/slack-github-action@03ea5433c137af7c0495bc0cad1af10403fc800c # v3.0.2
      if: steps.resolve-summary.outputs.summary != ''
      with:
        method: chat.postMessage
        token: ${{ inputs.SLACK_BOT_TOKEN }}
        payload: |
          channel: ${{ inputs.channel_id }}
          text: "*${{ inputs.title }}* ${{ inputs.warningOnly == 'true' && 'issues identified' || 'failed' }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "${{ inputs.warningOnly == 'true' && ':warning:' || ':no_entry:' }} Github Workflow ${{ github.workflow }} ${{ inputs.warningOnly == 'true' && 'ran and identified issues' || 'failed' }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Code scanning:*\n<${{ github.server_url }}/${{ github.repository }}/security/code-scanning>"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                - type: mrkdwn
                  text: "*Job:*\n${{ github.job }}"
                - type: mrkdwn
                  text: "*Repo:*\n${{ github.repository }}"
                - type: mrkdwn
                  text: "*Project:*\n${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}"
                - type: mrkdwn
                  text: "*Scan type:*\n${{ inputs.scan_context != '' && inputs.scan_context || 'n/a' }}"
            - type: section
              text:
                type: mrkdwn
                text: ${{ steps.prepare-summary.outputs.summary_json }}

name: 'Snyk Security Scan'
description: 'Run Snyk vulnerability scanning with configurable options'

inputs:
  subproject:
    description: 'For gradle multi module projects, leave blank for single module projects'
    required: false
    default: ''
  severity:
    description: 'Customisable severity levels'
    required: false
    default: 'HIGH,CRITICAL'
  scan_type:
    description: 'A scan type to use - either image (default) or fs'
    required: false
    default: 'image'
  location:
    description: 'A location for scans to take place'
    required: false
    default: '.'
  github_token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  snyk_token:
    description: 'Snyk token for authentication'
    required: true
  ECR_REGION:
    description: 'The AWS region that the ECR repository was created in'
    required: false
    default: 'eu-west-2'
  ECR_ROLE_TO_ASSUME:
    description: The AWS role to assume to authenticate to ECR
    required: false

outputs:
  results_count:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.results_count }}
  critical_count:
    description: 'Number of critical vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.critical_count }}
  high_count:
    description: 'Number of high vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.high_count }}
  medium_count:
    description: 'Number of medium vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.medium_count }}
  low_count:
    description: 'Number of low vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.low_count }}
  summary:
    description: 'Formatted summary of vulnerabilities'
    value: ${{ steps.snyk-summary.outputs.summary }}
  top_findings:
    description: 'Top 5 findings for Slack summary'
    value: ${{ steps.snyk-summary.outputs.top_findings }}
  sarif_upload_outcome:
    description: 'Outcome of the SARIF upload step'
    value: ${{ steps.snyk-upload.outcome }}

runs:
  using: composite
  steps:
    - name: Check repository in helm_deploy/values.yaml
      id: check-package-repo
      shell: bash
      if: inputs.scan_type == 'image'
      run: |
        echo 'checking package repository for ${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}}:'
        repo_info=$(grep -rh 'repository: ' --include="values.yaml" | grep ${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}} | head -n1 | awk -F'[:/ ]+' '{print $3"/"$4}')
        echo "repo=${repo_info}" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      if: ${{ inputs.ECR_ROLE_TO_ASSUME != '' && inputs.scan_type == 'image' }}
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      with:
        role-to-assume: ${{ inputs.ECR_ROLE_TO_ASSUME }}
        aws-region: ${{ inputs.ECR_REGION }}

    - name: Login to Amazon ECR
      if: ${{ inputs.ECR_ROLE_TO_ASSUME != '' && inputs.scan_type == 'image' }}
      uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

    - name: Login to GHCR for private images
      if: ${{ inputs.scan_type == 'image' && startsWith(steps.check-package-repo.outputs.repo, 'ghcr.io/') && github.event.repository.visibility != 'public' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Install Snyk CLI
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      with:
        snyk-version: '1.1296.0'

    - name: Validate Snyk authentication
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        # Normalize token in case a trailing newline was accidentally stored in the secret.
        normalized_token="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"
        if [[ -z "$normalized_token" ]]; then
          echo "SNYK_TOKEN is empty. Configure a valid token in repository/org secrets."
          exit 1
        fi

        if ! SNYK_TOKEN="$normalized_token" snyk auth "$normalized_token" >/dev/null 2>&1; then
          echo "Snyk authentication failed. Check token validity/org access and confirm the secret value is current."
          exit 1
        fi

    - name: Resolve severity threshold
      id: severity
      shell: bash
      run: |
        level=$(echo "${{ inputs.severity }}" | tr '[:upper:]' '[:lower:]')
        threshold='high'
        if [[ "$level" == *"low"* ]]; then
          threshold='low'
        elif [[ "$level" == *"medium"* ]]; then
          threshold='medium'
        elif [[ "$level" == *"high"* ]]; then
          threshold='high'
        elif [[ "$level" == *"critical"* ]]; then
          threshold='critical'
        fi
        echo "threshold=${threshold}" >> "$GITHUB_OUTPUT"

    - name: Snyk Security Scan - image
      id: snyk-analyse-image
      if: inputs.scan_type == 'image'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        export SNYK_TOKEN="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"
        image_ref="${{ steps.check-package-repo.outputs.repo }}/${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}}:latest"
        set +e
        snyk container test "$image_ref" \
          --app-vulns \
          --severity-threshold="${{ steps.severity.outputs.threshold }}" \
          --json-file-output=snyk-results.json \
          --sarif-file-output=snyk-results.sarif
        cmd_exit=$?
        set -e
        if [[ $cmd_exit -gt 1 ]]; then
          echo "Snyk container scan failed with exit code $cmd_exit"
          exit $cmd_exit
        fi

    - name: Snyk Security Scan - filesystem
      id: snyk-analyse-fs
      if: inputs.scan_type == 'fs'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        export SNYK_TOKEN="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"
        set +e
        snyk test "${{ inputs.location }}" \
          --all-projects \
          --severity-threshold="${{ steps.severity.outputs.threshold }}" \
          --json-file-output=snyk-results.json \
          --sarif-file-output=snyk-results.sarif
        cmd_exit=$?
        set -e
        if [[ $cmd_exit -gt 1 ]]; then
          echo "Snyk filesystem scan failed with exit code $cmd_exit"
          exit $cmd_exit
        fi

    - name: Normalize SARIF to single run
      shell: bash
      run: |
        if [[ ! -s snyk-results.sarif ]]; then
          cat > snyk-results.sarif << 'EOF'
        {"runs":[{"results":[]}]}
        EOF
        fi

        summary_source="SARIF fallback"

        jq '
          . as $doc
          | if (($doc.runs // []) | length) <= 1 then
              $doc
            else
              $doc
              | .runs = [
                  (
                    $doc.runs[0]
                    | .results = [ $doc.runs[] | .results[]? ]
                  )
                ]
            end
        ' snyk-results.sarif > snyk-results.single-run.sarif
        mv snyk-results.single-run.sarif snyk-results.sarif

    - name: Enrich SARIF for GitHub Security UI
      shell: bash
      run: |
        if [[ ! -s snyk-results.sarif || ! -s snyk-results.json ]]; then
          exit 0
        fi

        jq --slurpfile snyk snyk-results.json '
          def docs: ($snyk[0] // {});
          def all_vulns:
            [
              ((docs.vulnerabilities // [])[]?),
              ((docs.applications // [])[]? | .vulnerabilities[]?)
            ];
          def package_of($v):
            if (($v.packageName // $v.name // "") != "") then
              (($v.packageName // $v.name) + "@" + ($v.version // "unknown"))
            else
              "unknown"
            end;
          def cves_of($v): (($v.identifiers.CVE // []) | map(tostring) | unique | .[:3] | join(", "));
          def cwes_of($v): (($v.identifiers.CWE // []) | map(tostring) | unique | .[:3] | join(", "));
          def ghsas_of($v): (($v.identifiers.GHSA // []) | map(tostring) | unique | .[:3] | join(", "));
          def disclosure_of($v): (($v.disclosureTime // $v.publicationTime // $v.creationTime // "") | tostring | .[0:10]);
          def component_of_result:
            (.locations[0].logicalLocations[0].fullyQualifiedName
              // .locations[0].physicalLocation.artifactLocation.uri
              // "unknown");
          def find_vuln($id; $component):
            (
              all_vulns
              | map(select((.id // "") == $id and (package_of(.) == $component)))
              | .[0]
            ) // (
              all_vulns
              | map(select((.id // "") == $id))
              | .[0]
            );
          def ui_tags($v):
            (
              (($v.identifiers.CVE // []) | map("cve:" + tostring))
              + (($v.identifiers.CWE // []) | map("cwe:" + tostring))
              + (($v.identifiers.GHSA // []) | map("ghsa:" + tostring))
            ) | unique;

          . as $sarif
          | .runs[0].results = [
              .runs[0].results[]? as $r
              | ($r.ruleId // "issue") as $id
              | ($r | component_of_result) as $component
              | (find_vuln($id; $component)) as $v
              | if $v == null then
                  $r
                elif (($r.message.text // "") | contains(" | Package:")) then
                  $r
                else
                  (
                    " | Package: " + (package_of($v))
                    + " | CVE: " + (if (cves_of($v)) == "" then "n/a" else cves_of($v) end)
                    + " | CWE: " + (if (cwes_of($v)) == "" then "n/a" else cwes_of($v) end)
                    + " | GHSA: " + (if (ghsas_of($v)) == "" then "n/a" else ghsas_of($v) end)
                    + " | Disclosure: " + (if (disclosure_of($v)) == "" then "n/a" else disclosure_of($v) end)
                    + " | Ref: https://security.snyk.io/vuln/" + $id
                  ) as $extra
                  | $r
                  | .message.text = ((.message.text // "") + $extra)
                end
            ]
          | (
              [
                all_vulns[]?
                | {
                    id: (.id // "issue"),
                    name: (.id // "issue"),
                    shortDescription: { text: (.title // .id // "Snyk vulnerability") },
                    fullDescription: { text: (.title // .description // "Snyk vulnerability") },
                    helpUri: ("https://security.snyk.io/vuln/" + (.id // "issue")),
                    properties: { tags: ui_tags(.) }
                  }
              ]
              | unique_by(.id)
            ) as $enriched_rules
          | .runs[0].tool.driver.rules = (((.runs[0].tool.driver.rules // []) + $enriched_rules) | unique_by(.id))
        ' snyk-results.sarif > snyk-results.enriched.sarif

        mv snyk-results.enriched.sarif snyk-results.sarif

    - name: Upload Snyk artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      id: snyk-upload-artifact
      with:
        name: snyk-check-${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}
        path: |
          snyk-results.sarif
          snyk-results.json

    - name: Snyk upload sarif
      continue-on-error: true
      id: snyk-upload
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
      with:
        sarif_file: 'snyk-results.sarif'
        category: ${{ inputs.scan_type == 'image' && 'snyk-image-scan' || 'snyk-fs-scan' }}

    - name: Prepare Snyk summary
      id: snyk-summary
      shell: bash
      run: |
        if [[ ! -s snyk-results.sarif ]]; then
          cat > snyk-results.sarif << 'EOF'
        {"runs":[{"results":[]}]}
        EOF
        fi

        results_count=$(jq '[.runs[0].results[]?] | length' snyk-results.sarif)

        critical_count=$(jq '
          def sev:
            (
              ((.properties.tags // []) | map(tostring) | map(select(startswith("severity:"))) | (.[0]? | if . == null then null else ltrimstr("severity:") end)) //
              (.properties.severity? // .level? // "unknown")
            )
            | ascii_downcase
            | if . == "error" then "high"
              elif . == "warning" then "medium"
              elif . == "note" then "low"
              elif . == "none" then "low"
              else .
              end;
          [.runs[0].results[]? | select((sev) == "critical")] | length
        ' snyk-results.sarif)
        high_count=$(jq '
          def sev:
            (
              ((.properties.tags // []) | map(tostring) | map(select(startswith("severity:"))) | (.[0]? | if . == null then null else ltrimstr("severity:") end)) //
              (.properties.severity? // .level? // "unknown")
            )
            | ascii_downcase
            | if . == "error" then "high"
              elif . == "warning" then "medium"
              elif . == "note" then "low"
              elif . == "none" then "low"
              else .
              end;
          [.runs[0].results[]? | select((sev) == "high")] | length
        ' snyk-results.sarif)
        medium_count=$(jq '
          def sev:
            (
              ((.properties.tags // []) | map(tostring) | map(select(startswith("severity:"))) | (.[0]? | if . == null then null else ltrimstr("severity:") end)) //
              (.properties.severity? // .level? // "unknown")
            )
            | ascii_downcase
            | if . == "error" then "high"
              elif . == "warning" then "medium"
              elif . == "note" then "low"
              elif . == "none" then "low"
              else .
              end;
          [.runs[0].results[]? | select((sev) == "medium")] | length
        ' snyk-results.sarif)
        low_count=$(jq '
          def sev:
            (
              ((.properties.tags // []) | map(tostring) | map(select(startswith("severity:"))) | (.[0]? | if . == null then null else ltrimstr("severity:") end)) //
              (.properties.severity? // .level? // "unknown")
            )
            | ascii_downcase
            | if . == "error" then "high"
              elif . == "warning" then "medium"
              elif . == "note" then "low"
              elif . == "none" then "low"
              else .
              end;
          [.runs[0].results[]? | select((sev) == "low")] | length
        ' snyk-results.sarif)

        # Prefer JSON-derived counts (same source as top findings), fallback remains SARIF above.
        if [[ -s snyk-results.json ]]; then
          json_counts=$(jq -r '
            [
              (
                if (.vulnerabilities? | type) == "array" then
                  .vulnerabilities[]
                else
                  empty
                end
              ),
              (
                if (.applications? | type) == "array" then
                  .applications[] | .vulnerabilities[]?
                else
                  empty
                end
              )
              | {
                  rule: (.id // "issue"),
                  severity: ((.severity // "unknown") | ascii_downcase),
                  component: (
                    if (.packageName? // .name?) then
                      ((.packageName // .name) + "@" + (.version // "unknown"))
                    else
                      "unknown"
                    end
                  )
                }
            ]
            | unique_by(.rule + "|" + .severity + "|" + .component)
            | {
                total: length,
                critical: ([.[] | select(.severity == "critical")] | length),
                high: ([.[] | select(.severity == "high")] | length),
                medium: ([.[] | select(.severity == "medium")] | length),
                low: ([.[] | select(.severity == "low")] | length)
              }
            | [.total, .critical, .high, .medium, .low]
            | @tsv
          ' snyk-results.json 2>/dev/null || true)

          if [[ -n "$json_counts" ]]; then
            IFS=$'\t' read -r json_total json_critical json_high json_medium json_low <<< "$json_counts"
            if [[ -n "$json_total" ]]; then
              results_count="$json_total"
              critical_count="$json_critical"
              high_count="$json_high"
              medium_count="$json_medium"
              low_count="$json_low"
              summary_source="Snyk JSON"
            fi
          fi
        fi

        top_findings=""

        if [[ -s snyk-results.json ]]; then
          top_findings=$(jq -r '
            def rank:
              if . == "critical" then 0
              elif . == "high" then 1
              elif . == "medium" then 2
              elif . == "low" then 3
              else 4
              end;
            [
              (
                if (.vulnerabilities? | type) == "array" then
                  .vulnerabilities[]
                else
                  empty
                end
              ),
              (
                if (.applications? | type) == "array" then
                  .applications[] | .vulnerabilities[]?
                else
                  empty
                end
              )
              | {
                  rule: (.id // "issue"),
                  severity: ((.severity // "unknown") | ascii_downcase),
                  component: (
                    if (.packageName? // .name?) then
                      ((.packageName // .name) + "@" + (.version // "unknown"))
                    else
                      "unknown"
                    end
                  ),
                  cve: ((.identifiers.CVE // []) | map(tostring) | unique | join(", ")),
                  disclosure: ((.disclosureTime // .publicationTime // .creationTime // "") | tostring | .[0:10])
                }
            ]
            | unique_by(.rule + "|" + .severity + "|" + .component + "|" + .cve + "|" + .disclosure)
            | sort_by(.severity | rank)
            | .[:5]
            | .[]
            | "- \(.rule) [\(.severity)] (\(.component)) CVE: \((if .cve == "" then "n/a" else .cve end)) Disclosure: \((if .disclosure == "" then "n/a" else .disclosure end)) Link: <https://security.snyk.io/vuln/\(.rule)|\(.rule)>"
          ' snyk-results.json)
        fi

        if [[ -z "$top_findings" ]]; then
          top_findings=$(jq -r '
            def sev:
              (
                ((.properties.tags // []) | map(tostring) | map(select(startswith("severity:"))) | (.[0]? | if . == null then null else ltrimstr("severity:") end)) //
                (.properties.severity? // .level? // "unknown")
              )
              | ascii_downcase
              | if . == "error" then "high"
                elif . == "warning" then "medium"
                elif . == "note" then "low"
                elif . == "none" then "low"
                else .
                end;
            def rank:
              if . == "critical" then 0
              elif . == "high" then 1
              elif . == "medium" then 2
              elif . == "low" then 3
              else 4
              end;
            [
              .runs[0].results[]?
              | {
                rule: (.ruleId // "issue"),
                severity: sev,
                component: (.locations[0].logicalLocations[0].fullyQualifiedName // .locations[0].physicalLocation.artifactLocation.uri // "unknown")
              }
            ]
            | sort_by(.severity | rank)
            | .[:5]
            | .[]
            | "- \(.rule) [\(.severity)] (\(.component)) CVE: n/a Disclosure: n/a Link: <https://security.snyk.io/vuln/\(.rule)|\(.rule)>"
          ' snyk-results.sarif)
        fi

        # Fallback for SARIF variants where nested location fields are missing/unexpected.
        if [[ "$results_count" -gt 0 && -z "$top_findings" ]]; then
          top_findings=$(jq -r '
            def sev:
              ((.level? // "unknown") | ascii_downcase
                | if . == "error" then "high"
                  elif . == "warning" then "medium"
                  elif . == "note" then "low"
                  elif . == "none" then "low"
                  else .
                  end);
            .runs[0].results[]?
            | "- \(.ruleId // "issue") [\(sev)] (unknown) CVE: n/a Disclosure: n/a Link: <https://security.snyk.io/vuln/\(.ruleId // "issue")|\(.ruleId // "issue")>"
          ' snyk-results.sarif | head -n 5)
        fi

        if [[ "$results_count" -gt 0 ]]; then
          if [[ -n "$top_findings" ]]; then
            slack_summary="Total: ${results_count} (Critical: ${critical_count}, High: ${high_count}, Medium: ${medium_count}, Low: ${low_count})"
            slack_summary+=$'\nSource: '
            slack_summary+="${summary_source}"
            slack_summary+=$'\nTop findings:\n'
            slack_summary+="${top_findings}"
          else
            slack_summary="Total: ${results_count} (Critical: ${critical_count}, High: ${high_count}, Medium: ${medium_count}, Low: ${low_count})"
            slack_summary+=$'\nSource: '
            slack_summary+="${summary_source}"
          fi
          if [[ ${#slack_summary} -gt 3000 ]]; then
            slack_summary="${slack_summary:0:2997}..."
          fi
        else
          slack_summary="No vulnerabilities found"
          top_findings=""
        fi

        echo "results_count=${results_count}" >> "$GITHUB_OUTPUT"
        echo "critical_count=${critical_count}" >> "$GITHUB_OUTPUT"
        echo "high_count=${high_count}" >> "$GITHUB_OUTPUT"
        echo "medium_count=${medium_count}" >> "$GITHUB_OUTPUT"
        echo "low_count=${low_count}" >> "$GITHUB_OUTPUT"
        {
          echo "top_findings<<EOF"
          echo "${top_findings}"
          echo "EOF"
          echo "summary<<EOF"
          echo "${slack_summary}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

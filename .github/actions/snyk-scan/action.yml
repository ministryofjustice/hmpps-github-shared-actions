name: 'Snyk Security Scan'
description: 'Run Snyk vulnerability scanning with configurable options'

inputs:
  subproject:
    description: 'For gradle multi module projects, leave blank for single module projects'
    required: false
    default: ''
  severity:
    description: 'Customisable severity levels'
    required: false
    default: 'HIGH,CRITICAL'
  scan_type:
    description: 'A scan type to use - either image (default) or fs'
    required: false
    default: 'image'
  location:
    description: 'A location for scans to take place'
    required: false
    default: '.'
  java_version:
    description: 'Java version to install for filesystem scans (used by Kotlin/Gradle/Maven projects)'
    required: false
    default: '25'
  snyk_policy_path:
    description: 'Optional path to .snyk policy file used for ignore rules'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  snyk_token:
    description: 'Snyk token for authentication'
    required: true
  ECR_REGION:
    description: 'The AWS region that the ECR repository was created in'
    required: false
    default: 'eu-west-2'
  ECR_ROLE_TO_ASSUME:
    description: The AWS role to assume to authenticate to ECR
    required: false

outputs:
  results_count:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.results_count }}
  critical_count:
    description: 'Number of critical vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.critical_count }}
  high_count:
    description: 'Number of high vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.high_count }}
  medium_count:
    description: 'Number of medium vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.medium_count }}
  low_count:
    description: 'Number of low vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.low_count }}
  summary:
    description: 'Formatted summary of vulnerabilities'
    value: ${{ steps.snyk-summary.outputs.summary }}
  top_findings:
    description: 'Top 5 findings for Slack summary'
    value: ${{ steps.snyk-summary.outputs.top_findings }}
  sarif_upload_outcome:
    description: 'Outcome of the SARIF upload step'
    value: ${{ steps.snyk-upload.outcome }}

runs:
  using: composite
  steps:
    - name: Check repository in helm_deploy/values.yaml
      id: check-package-repo
      shell: bash
      if: inputs.scan_type == 'image'
      run: |
        echo 'checking package repository for ${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}}:'
        repo_info=$(grep -rh 'repository: ' --include="values.yaml" | grep ${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}} | head -n1 | awk -F'[:/ ]+' '{print $3"/"$4}')
        echo "repo=${repo_info}" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      if: ${{ inputs.ECR_ROLE_TO_ASSUME != '' && inputs.scan_type == 'image' }}
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      with:
        role-to-assume: ${{ inputs.ECR_ROLE_TO_ASSUME }}
        aws-region: ${{ inputs.ECR_REGION }}

    - name: Login to Amazon ECR
      if: ${{ inputs.ECR_ROLE_TO_ASSUME != '' && inputs.scan_type == 'image' }}
      uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

    - name: Login to GHCR for private images
      if: ${{ inputs.scan_type == 'image' && startsWith(steps.check-package-repo.outputs.repo, 'ghcr.io/') && github.event.repository.visibility != 'public' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Install Snyk CLI
      shell: bash
      run: |
        npm install -g snyk@1.1296.0

    - name: Validate Snyk authentication
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        # Normalize token in case a trailing newline was accidentally stored in the secret.
        normalized_token="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"
        if [[ -z "$normalized_token" ]]; then
          echo "SNYK_TOKEN is empty. Configure a valid token in repository/org secrets."
          exit 1
        fi

        if ! SNYK_TOKEN="$normalized_token" snyk auth "$normalized_token" >/dev/null 2>&1; then
          echo "Snyk authentication failed. Check token validity/org access and confirm the secret value is current."
          exit 1
        fi

    - name: Resolve severity threshold
      id: severity
      shell: bash
      run: |
        level=$(echo "${{ inputs.severity }}" | tr '[:upper:]' '[:lower:]')
        threshold='high'
        if [[ "$level" == *"low"* ]]; then
          threshold='low'
        elif [[ "$level" == *"medium"* ]]; then
          threshold='medium'
        elif [[ "$level" == *"high"* ]]; then
          threshold='high'
        elif [[ "$level" == *"critical"* ]]; then
          threshold='critical'
        fi
        echo "threshold=${threshold}" >> "$GITHUB_OUTPUT"

    - name: Setup Java for filesystem scans
      if: inputs.scan_type == 'fs'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: Snyk Security Scan - image
      id: snyk-analyse-image
      if: inputs.scan_type == 'image'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        export SNYK_TOKEN="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"
        image_ref="${{ steps.check-package-repo.outputs.repo }}/${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}}:latest"

        policy_path="${{ inputs.snyk_policy_path }}"
        if [[ -z "$policy_path" ]]; then
          policy_path="${{ inputs.location }}/.snyk"
        fi
        policy_arg=""
        if [[ -f "$policy_path" ]]; then
          policy_arg="--policy-path=${policy_path}"
          echo "Applying Snyk policy file: ${policy_path}"
        fi

        set +e
        snyk container test "$image_ref" \
          --app-vulns \
          --severity-threshold="${{ steps.severity.outputs.threshold }}" \
          ${policy_arg:+$policy_arg} \
          --json-file-output=snyk-results.json \
          --sarif-file-output=snyk-results.sarif
        cmd_exit=$?
        set -e
        if [[ $cmd_exit -gt 1 ]]; then
          echo "Snyk container scan failed with exit code $cmd_exit"
          exit $cmd_exit
        fi

    - name: Snyk Security Scan - filesystem
      id: snyk-analyse-fs
      if: inputs.scan_type == 'fs'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        export SNYK_TOKEN="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"

        scan_location="${{ inputs.location }}"
        if [[ ! -d "$scan_location" ]]; then
          echo "Snyk filesystem scan location does not exist or is not a directory: '$scan_location'"
          exit 1
        fi

        # Fail early with a clear message when the target directory has no supported manifests.
        if ! find "$scan_location" -type f \( \
          -name 'package.json' -o \
          -name 'package-lock.json' -o \
          -name 'yarn.lock' -o \
          -name 'pnpm-lock.yaml' -o \
          -name 'pom.xml' -o \
          -name 'build.gradle' -o \
          -name 'build.gradle.kts' -o \
          -name 'settings.gradle' -o \
          -name 'settings.gradle.kts' -o \
          -name 'requirements.txt' -o \
          -name 'Pipfile' -o \
          -name 'poetry.lock' -o \
          -name 'pyproject.toml' -o \
          -name 'Gemfile' -o \
          -name 'Gemfile.lock' -o \
          -name 'go.mod' -o \
          -name 'go.sum' -o \
          -name 'composer.json' -o \
          -name 'composer.lock' -o \
          -name 'Cargo.toml' -o \
          -name 'Cargo.lock' -o \
          -name 'packages.config' -o \
          -name '*.csproj' -o \
          -name '*.fsproj' -o \
          -name '*.vbproj' \
        \) -print -quit | grep -q .; then
          echo "Snyk filesystem scan could not find supported target files in '$scan_location'."
          echo "Set 'location' to a directory containing manifests like package.json, pom.xml, build.gradle, requirements.txt, pyproject.toml, or go.mod."
          exit 1
        fi

        # Ensure Gradle wrappers are executable so Snyk can resolve dependencies in Kotlin/Gradle projects.
        while IFS= read -r gradlew_path; do
          chmod +x "$gradlew_path" || true
        done < <(find "$scan_location" -type f -name 'gradlew')

        # Preflight Gradle projects to surface dependency/auth issues before Snyk wraps the failure.
        gradle_manifest=$(find "$scan_location" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit || true)
        use_all_projects=true
        if [[ -n "$gradle_manifest" ]]; then
          # Snyk 1.1296.0 + Gradle 9.x can fail in --all-projects mode due to unsupported --build-file usage.
          # For Gradle repositories, run without --all-projects as a compatibility workaround.
          use_all_projects=false
          gradle_dir=$(dirname "$gradle_manifest")
          gradlew_cmd=""
          if [[ -x "$gradle_dir/gradlew" ]]; then
            gradlew_cmd="$gradle_dir/gradlew"
          elif [[ -x "$scan_location/gradlew" ]]; then
            gradlew_cmd="$scan_location/gradlew"
          fi

          if [[ -n "$gradlew_cmd" ]]; then
            echo "Running Gradle preflight in '$gradle_dir' via '$gradlew_cmd'"
            set +e
            (
              cd "$gradle_dir"
              "$gradlew_cmd" -q help --no-daemon --stacktrace
            ) > gradle-preflight.log 2>&1
            gradle_preflight_exit=$?
            set -e
            if [[ $gradle_preflight_exit -ne 0 ]]; then
              echo "Gradle preflight failed before Snyk scan. This usually indicates dependency repository auth or build configuration issues."
              echo "Last 200 lines of gradle-preflight.log:"
              tail -n 200 gradle-preflight.log || true
              exit 2
            fi
          else
            echo "Gradle manifest detected but no executable gradlew found. Adding a Gradle wrapper is recommended for reliable CI dependency resolution."
          fi
        fi

        echo "Java runtime for fs scan:"
        java -version || true

        policy_path="${{ inputs.snyk_policy_path }}"
        if [[ -z "$policy_path" ]]; then
          policy_path="${{ inputs.location }}/.snyk"
        fi
        policy_arg=""
        if [[ -f "$policy_path" ]]; then
          policy_arg="--policy-path=${policy_path}"
          echo "Applying Snyk policy file: ${policy_path}"
        fi

        set +e
        if [[ "$use_all_projects" == "true" ]]; then
          snyk test "${{ inputs.location }}" \
            --all-projects \
            --severity-threshold="${{ steps.severity.outputs.threshold }}" \
            ${policy_arg:+$policy_arg} \
            --json-file-output=snyk-results.json \
            --sarif-file-output=snyk-results.sarif
        else
          echo "Gradle project detected; running Snyk without --all-projects to avoid Gradle 9 compatibility issue."
          snyk test "${{ inputs.location }}" \
            --severity-threshold="${{ steps.severity.outputs.threshold }}" \
            ${policy_arg:+$policy_arg} \
            --json-file-output=snyk-results.json \
            --sarif-file-output=snyk-results.sarif
        fi
        cmd_exit=$?
        set -e
        if [[ $cmd_exit -eq 3 ]]; then
          echo "Snyk filesystem scan could not find supported target files in '${{ inputs.location }}'."
          echo "Set 'location' to a directory containing supported manifests (for example pom.xml, build.gradle, package.json, requirements.txt)."
          exit $cmd_exit
        fi
        if [[ $cmd_exit -eq 2 ]]; then
          echo "Snyk filesystem scan failed to resolve dependencies (exit code 2)."
          echo "Common causes: private package repo credentials missing, Gradle/Maven auth config missing, or project toolchain mismatch."
          echo "Re-running Snyk in debug mode to surface root cause..."

          set +e
          if [[ "$use_all_projects" == "true" ]]; then
            DEBUG='*snyk*' snyk test "${{ inputs.location }}" \
              --all-projects \
              --severity-threshold="${{ steps.severity.outputs.threshold }}" \
              ${policy_arg:+$policy_arg} \
              -d > snyk-debug.log 2>&1
          else
            DEBUG='*snyk*' snyk test "${{ inputs.location }}" \
              --severity-threshold="${{ steps.severity.outputs.threshold }}" \
              ${policy_arg:+$policy_arg} \
              -d > snyk-debug.log 2>&1
          fi
          set -e

          if grep -q '===== DEBUG INFORMATION START =====' snyk-debug.log; then
            echo "Snyk debug information block:"
            sed -n '/===== DEBUG INFORMATION START =====/,/===== DEBUG INFORMATION END =====/p' snyk-debug.log | tail -n 400 || true
          else
            echo "Last 200 lines of Snyk debug log:"
            tail -n 200 snyk-debug.log || true
          fi
          exit $cmd_exit
        fi
        if [[ $cmd_exit -gt 1 ]]; then
          echo "Snyk filesystem scan failed with exit code $cmd_exit"
          exit $cmd_exit
        fi

    - name: Process SARIF for GitHub Security UI
      shell: bash
      run: |
        bash "${{ github.action_path }}/process_snyk_results.sh" process-sarif

    - name: Validate SARIF consistency
      shell: bash
      run: |
        sarif_results=$(jq -r '[.runs[0].results[]?] | length' snyk-results.sarif 2>/dev/null || echo 0)
        json_vulns=$(jq -r '
          def roots: if type == "array" then .[] else . end;
          [
            roots | select(type == "object")
            | ((.vulnerabilities // [])[]?), ((.applications // [])[]? | (.vulnerabilities // [])[]?)
            | select(type == "object")
          ] | length
        ' snyk-results.json 2>/dev/null || echo 0)

        echo "SARIF results: ${sarif_results}; JSON vulnerabilities: ${json_vulns}"
        if [[ "${json_vulns}" -gt 0 && "${sarif_results}" -eq 0 ]]; then
          echo "SARIF has zero results while JSON has vulnerabilities. Failing to avoid silent Security tab non-updates."
          exit 1
        fi

    - name: Upload Snyk artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      id: snyk-upload-artifact
      with:
        name: snyk-check-${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}
        path: |
          snyk-results.sarif
          snyk-results.json
          snyk-debug.log
          gradle-preflight.log

    - name: Snyk upload sarif
      id: snyk-upload
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
      with:
        sarif_file: 'snyk-results.sarif'
        category: ${{ inputs.scan_type == 'image' && 'snyk-image-scan' || 'snyk-fs-scan' }}

    - name: Verify SARIF upload outcome
      if: ${{ always() && (steps.snyk-analyse-image.outcome == 'success' || steps.snyk-analyse-fs.outcome == 'success') }}
      shell: bash
      run: |
        if [[ "${{ steps.snyk-upload.outcome }}" != "success" ]]; then
          echo "SARIF upload did not succeed (outcome: ${{ steps.snyk-upload.outcome }})."
          exit 1
        fi

    - name: Prepare Snyk summary
      id: snyk-summary
      shell: bash
      run: |
        bash "${{ github.action_path }}/process_snyk_results.sh" prepare-summary

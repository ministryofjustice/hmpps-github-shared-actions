name: 'Snyk Security Scan'
description: 'Run Snyk vulnerability scanning with configurable options'

inputs:
  subproject:
    description: 'For gradle multi module projects, leave blank for single module projects'
    required: false
    default: ''
  severity:
    description: 'Customisable severity levels'
    required: false
    default: 'HIGH,CRITICAL'
  scan_type:
    description: 'A scan type to use - either image (default) or fs'
    required: false
    default: 'image'
  location:
    description: 'A location for scans to take place'
    required: false
    default: '.'
  java_version:
    description: 'Java version to install for filesystem scans (used by Kotlin/Gradle/Maven projects)'
    required: false
    default: '25'
  snyk_policy_path:
    description: 'Optional path to .snyk policy file used for ignore rules'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  snyk_token:
    description: 'Snyk token for authentication'
    required: false
  client_id:
    description: 'Snyk client ID for authentication'
    required: false
  client_secret:
    description: 'Snyk client secret for authentication'
    required: false
  ECR_REGION:
    description: 'The AWS region that the ECR repository was created in'
    required: false
    default: 'eu-west-2'
  ECR_ROLE_TO_ASSUME:
    description: The AWS role to assume to authenticate to ECR
    required: false

outputs:
  results_count:
    description: 'Number of vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.results_count }}
  critical_count:
    description: 'Number of critical vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.critical_count }}
  high_count:
    description: 'Number of high vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.high_count }}
  medium_count:
    description: 'Number of medium vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.medium_count }}
  low_count:
    description: 'Number of low vulnerabilities found'
    value: ${{ steps.snyk-summary.outputs.low_count }}
  summary:
    description: 'Formatted summary of vulnerabilities'
    value: ${{ steps.snyk-summary.outputs.summary }}
  top_findings:
    description: 'Top 5 findings for Slack summary'
    value: ${{ steps.snyk-summary.outputs.top_findings }}
  sarif_upload_outcome:
    description: 'Outcome of the SARIF upload step'
    value: ${{ steps.snyk-upload.outcome }}

runs:
  using: composite
  steps:
    - name: Check repository in helm_deploy/values.yaml
      id: check-package-repo
      shell: bash
      if: inputs.scan_type == 'image'
      run: |
        echo 'checking package repository for ${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}}:'
        repo_info=$(grep -rh 'repository: ' --include="values.yaml" | grep ${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}} | head -n1 | awk -F'[:/ ]+' '{print $3"/"$4}')
        echo "repo=${repo_info}" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      if: ${{ inputs.ECR_ROLE_TO_ASSUME != '' && inputs.scan_type == 'image' }}
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      with:
        role-to-assume: ${{ inputs.ECR_ROLE_TO_ASSUME }}
        aws-region: ${{ inputs.ECR_REGION }}

    - name: Login to Amazon ECR
      if: ${{ inputs.ECR_ROLE_TO_ASSUME != '' && inputs.scan_type == 'image' }}
      uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

    - name: Login to GHCR for private images
      if: ${{ inputs.scan_type == 'image' && startsWith(steps.check-package-repo.outputs.repo, 'ghcr.io/') && github.event.repository.visibility != 'public' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Install Snyk CLI
      shell: bash
      run: |
        # Shared action controls Snyk CLI version centrally; callers cannot override it.
        SNYK_CLI_VERSION='1.1304.2'
        npm install -g "snyk@${SNYK_CLI_VERSION}"
        snyk --version

    - name: Validate Snyk authentication using client_id and client_secret
      if: inputs.client_id != '' && inputs.client_secret != ''
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client_id }}
        CLIENT_SECRET: ${{ inputs.client_secret }}
      run: |
        if [[ -z "$CLIENT_ID" || -z "$CLIENT_SECRET" ]]; then
          echo "CLIENT_ID or CLIENT_SECRET is empty. Configure valid Snyk OAuth credentials in repository/org secrets."
          exit 1
        fi

        if ! snyk auth --client-id "$CLIENT_ID" --client-secret "$CLIENT_SECRET" >/dev/null 2>&1; then
          echo "Snyk authentication failed. Check client credentials and org access, and confirm secret values are current."
          exit 1
        else
          echo "Snyk authentication successful with client credentials."
        fi

    - name: Validate Snyk authentication using api token
      if: inputs.snyk_token != '' && (inputs.client_id == '' || inputs.client_secret == '')
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk_token }}
      run: |
        token="$(printf '%s' "$SNYK_TOKEN" | tr -d '\r\n')"
        if [[ -z "$token" ]]; then
          echo "SNYK_TOKEN is empty. Configure a valid token in repository/org secrets."
          exit 1
        fi

        if ! snyk auth --token "$token" >/dev/null 2>&1; then
          echo "Snyk authentication failed. Check API token and org access, and confirm secret values are current."
          exit 1
        else
          echo "SNYK_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Snyk authentication successful with API token."
        fi

    - name: Resolve severity threshold
      id: severity
      shell: bash
      run: |
        level=$(echo "${{ inputs.severity }}" | tr '[:upper:]' '[:lower:]')
        threshold='high'
        if [[ "$level" == *"low"* ]]; then
          threshold='low'
        elif [[ "$level" == *"medium"* ]]; then
          threshold='medium'
        elif [[ "$level" == *"high"* ]]; then
          threshold='high'
        elif [[ "$level" == *"critical"* ]]; then
          threshold='critical'
        fi
        echo "threshold=${threshold}" >> "$GITHUB_OUTPUT"

    - name: Detect filesystem project types
      id: detect-fs-project
      if: inputs.scan_type == 'fs'
      shell: bash
      env:
        SCAN_LOCATION: ${{ inputs.location }}
      run: |
        bash "${{ github.action_path }}/detect_fs_project_types.sh" "${SCAN_LOCATION:-.}" >> "$GITHUB_OUTPUT"

    - name: Prepare Gradle or Maven wrappers
      if: inputs.scan_type == 'fs' && (steps.detect-fs-project.outputs.project_type == 'gradle' || steps.detect-fs-project.outputs.project_type == 'maven')
      shell: bash
      env:
        SCAN_LOCATION: ${{ inputs.location }}
        PROJECT_TYPE: ${{ steps.detect-fs-project.outputs.project_type }}
      run: |
        scan_location="${SCAN_LOCATION:-.}"
        if [[ "$PROJECT_TYPE" == "gradle" ]]; then
          while IFS= read -r gradlew_path; do
            chmod +x "$gradlew_path" || true
          done < <(find "$scan_location" -type f -name 'gradlew')
        fi

        if [[ "$PROJECT_TYPE" == "maven" ]]; then
          while IFS= read -r mvnw_path; do
            chmod +x "$mvnw_path" || true
          done < <(find "$scan_location" -type f -name 'mvnw')

          if ! command -v mvn >/dev/null 2>&1 && ! find "$scan_location" -type f -name 'mvnw' -print -quit | grep -q .; then
            echo "Detected pom.xml but neither Maven (mvn) nor Maven wrapper (mvnw) is available."
            echo "Install Maven or include mvnw in the repository for filesystem scans of Maven projects."
            exit 2
          fi
        fi

    - name: Setup uv for filesystem scans
      if: inputs.scan_type == 'fs' && steps.detect-fs-project.outputs.project_type == 'uv'
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          echo "uv already available: $(uv --version 2>/dev/null || echo 'unknown version')"
          exit 0
        fi

        echo "Detected uv.lock. Installing uv..."
        if ! curl -LsSf https://astral.sh/uv/install.sh | sh; then
          echo "Failed to install uv automatically. Install uv in the runner for projects using uv.lock."
          exit 1
        fi

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        if ! command -v uv >/dev/null 2>&1; then
          echo "uv install completed but uv is still not in PATH."
          exit 1
        fi

        echo "Installed uv: $(uv --version 2>/dev/null || echo 'unknown version')"

    - name: Setup Java for filesystem scans on Kotlin/Gradle/Maven projects
      if: inputs.scan_type == 'fs' && (steps.detect-fs-project.outputs.project_type == 'gradle' || steps.detect-fs-project.outputs.project_type == 'maven')
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: Setup Go for filesystem scans
      if: inputs.scan_type == 'fs' && steps.detect-fs-project.outputs.project_type == 'go'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5

    - name: Setup .NET for filesystem scans
      if: inputs.scan_type == 'fs' && steps.detect-fs-project.outputs.project_type == 'dotnet'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

    - name: Setup Ruby for filesystem scans
      if: inputs.scan_type == 'fs' && steps.detect-fs-project.outputs.project_type == 'ruby'
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1

    # - name: Setup PHP for filesystem scans
    #   if: inputs.scan_type == 'fs' && steps.detect-fs-project.outputs.project_type == 'php'
    #   uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2

    # - name: Setup Rust for filesystem scans
    #   if: inputs.scan_type == 'fs' && steps.detect-fs-project.outputs.project_type == 'rust'
    #   uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    - name: Snyk Security Scan - image
      id: snyk-analyse-image
      if: inputs.scan_type == 'image'
      shell: bash
      run: |
        image_ref="${{ steps.check-package-repo.outputs.repo }}/${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject}}:latest"

        policy_path="${{ inputs.snyk_policy_path }}"
        if [[ -z "$policy_path" ]]; then
          policy_path="${{ inputs.location }}/.snyk"
        fi
        policy_arg=""
        if [[ -f "$policy_path" ]]; then
          policy_arg="--policy-path=${policy_path}"
          echo "Applying Snyk policy file: ${policy_path}"
        fi

        set +e
        snyk container test "$image_ref" \
          --app-vulns \
          --severity-threshold="${{ steps.severity.outputs.threshold }}" \
          ${policy_arg:+$policy_arg} \
          --json-file-output=snyk-results.json \
          --sarif-file-output=snyk-results.sarif
        cmd_exit=$?
        set -e
        if [[ $cmd_exit -gt 1 ]]; then
          echo "Snyk container scan failed with exit code $cmd_exit"
          exit $cmd_exit
        fi

    - name: Snyk Security Scan - filesystem
      id: snyk-analyse-fs
      if: inputs.scan_type == 'fs'
      shell: bash
      env:
        SCAN_LOCATION: ${{ inputs.location }}
        SNYK_POLICY_PATH_INPUT: ${{ inputs.snyk_policy_path }}
        SEVERITY_THRESHOLD: ${{ steps.severity.outputs.threshold }}
      run: |
        bash "${{ github.action_path }}/run_snyk_fs_scan.sh"

    - name: Process SARIF for GitHub Security UI
      shell: bash
      run: |
        bash "${{ github.action_path }}/process_snyk_results.sh" process-sarif

    - name: Validate SARIF consistency
      shell: bash
      run: |
        sarif_results=$(jq -r '[.runs[0].results[]?] | length' snyk-results.sarif 2>/dev/null || echo 0)
        json_vulns=$(jq -r '
          def roots: if type == "array" then .[] else . end;
          [
            roots | select(type == "object")
            | ((.vulnerabilities // [])[]?), ((.applications // [])[]? | (.vulnerabilities // [])[]?)
            | select(type == "object")
          ] | length
        ' snyk-results.json 2>/dev/null || echo 0)

        echo "SARIF results: ${sarif_results}; JSON vulnerabilities: ${json_vulns}"
        if [[ "${json_vulns}" -gt 0 && "${sarif_results}" -eq 0 ]]; then
          echo "SARIF has zero results while JSON has vulnerabilities. Failing to avoid silent Security tab non-updates."
          exit 1
        fi

    - name: Upload Snyk artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      id: snyk-upload-artifact
      with:
        name: snyk-check-${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}
        path: |
          snyk-results.sarif
          snyk-results.json
          snyk-debug.log
          gradle-preflight.log

    - name: Snyk upload sarif
      id: snyk-upload
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
      with:
        sarif_file: 'snyk-results.sarif'
        category: ${{ inputs.scan_type == 'image' && 'snyk-image-scan' || 'snyk-fs-scan' }}

    - name: Verify SARIF upload outcome
      if: ${{ always() && (steps.snyk-analyse-image.outcome == 'success' || steps.snyk-analyse-fs.outcome == 'success') }}
      shell: bash
      run: |
        if [[ "${{ steps.snyk-upload.outcome }}" != "success" ]]; then
          echo "SARIF upload did not succeed (outcome: ${{ steps.snyk-upload.outcome }})."
          exit 1
        fi

    - name: Prepare Snyk summary
      id: snyk-summary
      shell: bash
      run: |
        bash "${{ github.action_path }}/process_snyk_results.sh" prepare-summary

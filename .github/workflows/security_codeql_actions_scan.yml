name: Security CodeQL Github Actions scan

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * MON-FRI'

permissions:
  contents: read
  security-events: write

jobs:
  security-codeql-scan:
    name: Security CodeQL Github Actions scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # 4.38.1
      with:
        languages: actions 
    - name: Perform CodeQL Analysis
      id: codeql_analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # 4.38.1
    - name: CodeQL slack notification
      uses: ./.github/actions/slack_codescan_notification
      if: (failure() || steps.codeql_analysis.outcome == 'failure') && inputs.channel_id != 'NO_SLACK'
      with:
        title: "CodeQL Actions Scan"
        warningOnly: ${{ steps.codeql_analysis.outcome == 'success' }}
        channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
        SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}

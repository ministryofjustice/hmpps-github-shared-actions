name: Security CodeQL Github Actions scan

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * MON-FRI"

permissions:
  contents: read
  security-events: write

jobs:
  security-codeql-scan:
    name: Security CodeQL Github Actions scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # 4.36.0
        with:
          languages: actions
      - name: Perform CodeQL Analysis
        id: codeql_analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # 4.36.0
      - name: CodeQL slack notification
        uses: ./.github/actions/slack_codescan_notification
        if: (failure() || steps.codeql_analysis.outcome == 'failure') && inputs.channel_id != 'NO_SLACK'
        with:
          title: "CodeQL Actions Scan"
          warningOnly: ${{ steps.codeql_analysis.outcome == 'success' }}
          channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
          SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
